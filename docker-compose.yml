version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: my_music_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    build: .
    container_name: my_music_app
    restart: always
    ports:
      - "8085:3000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=${PORT}
      - MAIL_SERVICE_URL=${MAIL_SERVICE_URL}
    depends_on:
      db:
        condition: service_healthy

  mail-service:
    build: .
    container_name: my_music_mail
    command: node src/service_auxiliere/mail/mail.js
    restart: always
    ports:
      - "4001:4001"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

  upload-service:
    build: .
    container_name: my_music_upload
    working_dir: /app/src/service_auxiliere/upload
    command: sh -c "npm install && node upload.js"
    restart: always
    ports:
      - "4002:4002"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    volumes:
      - upload_data:/app/src/service_auxiliere/upload/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  upload_data:
