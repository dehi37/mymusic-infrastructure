AWSTemplateFormatVersion: '2010-09-09'
Description: "Cluster ECS Fargate dans les sous-réseaux privés"

Parameters:
  Env:
    Type: String
  EcrImageUri:
    Type: String
    Default: "049618906674.dkr.ecr.us-east-1.amazonaws.com/mymusic-app"

Resources:
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "mymusic-cluster-${Env}"

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "mymusic-ecs-execution-role-${Env}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "mymusic-task-${Env}"
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: !Sub "mymusic-container-${Env}"
          Image: !Sub "${EcrImageUri}:${Env}"
          Essential: true
          PortMappings:
            - ContainerPort: 80
              HostPort: 80

  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "mymusic-service-${Env}"
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ECSTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue
              'Fn::Sub': "mymusic-${Env}-PrivateSubnet1"
            - !ImportValue
              'Fn::Sub': "mymusic-${Env}-PrivateSubnet2"
          SecurityGroups:
            - !ImportValue
              'Fn::Sub': "mymusic-${Env}-ECSSecurityGroup"
      LoadBalancers:
        - ContainerName: !Sub "mymusic-container-${Env}"
          ContainerPort: 80
          TargetGroupArn: !ImportValue
            'Fn::Sub': "mymusic-${Env}-TargetGroupArn"

Outputs:
  ECSClusterName:
    Value: !Ref ECSCluster
    Export:
      Name: !Sub "mymusic-${Env}-ECSClusterName"
  ECSServiceName:
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub "mymusic-${Env}-ECSServiceName"
