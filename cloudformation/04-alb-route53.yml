AWSTemplateFormatVersion: '2010-09-09'
Description: "Routing DNS Route 53 et Application Load Balancer"

Parameters:
  Env:
    Type: String
  DomainName:
    Type: String
  HostedZoneId:
    Type: String

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub "www.mymusic.${DomainName}"
      SubjectAlternativeNames:
        - !Sub "*.mymusic.${DomainName}"
        - !Sub "${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub "www.mymusic.${DomainName}"
          HostedZoneId: !Ref HostedZoneId

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "mymusic-alb-${Env}"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !ImportValue
          'Fn::Sub': "mymusic-${Env}-PublicSubnet1"
        - !ImportValue
          'Fn::Sub': "mymusic-${Env}-PublicSubnet2"
      SecurityGroups:
        - !ImportValue
          'Fn::Sub': "mymusic-${Env}-ALBSecurityGroup"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "mymusic-tg-${Env}"
      Port: 80
      Protocol: HTTP
      VpcId: !ImportValue
        'Fn::Sub': "mymusic-${Env}-VpcId"
      TargetType: ip
      HealthCheckPath: "/"
      HealthCheckIntervalSeconds: 30

  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.mymusic.${DomainName}."
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        EvaluateTargetHealth: false

Outputs:
  ALBDNSName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "mymusic-${Env}-ALBDNSName"
  ALBHostedZoneId:
    Value: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub "mymusic-${Env}-ALBHostedZoneId"
  TargetGroupArn:
    Value: !Ref TargetGroup
    Export:
      Name: !Sub "mymusic-${Env}-TargetGroupArn"
